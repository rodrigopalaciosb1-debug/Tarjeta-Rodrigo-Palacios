<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rodrigo Palacios B. — Educalab.ec</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #E87722;
    --orange-deep: #C85F0A;
    --orange-glow: #FF9940;
    --black: #0D0D0D;
    --dark: #161616;
    --mid: #1F1F1F;
    --border: rgba(232,119,34,0.25);
    --text-dim: rgba(255,255,255,0.45);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--black);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'DM Sans', sans-serif;
    overflow: hidden;
    position: relative;
  }

  /* Background texture */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 50% -10%, rgba(232,119,34,0.18) 0%, transparent 60%),
      radial-gradient(ellipse 40% 40% at 90% 100%, rgba(232,119,34,0.10) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  /* Diagonal accent line */
  body::after {
    content: '';
    position: fixed;
    top: -20%;
    right: -5%;
    width: 2px;
    height: 140%;
    background: linear-gradient(180deg, transparent 0%, var(--orange) 40%, transparent 100%);
    opacity: 0.3;
    transform: rotate(12deg);
    pointer-events: none;
    z-index: 0;
  }

  .card-wrapper {
    position: relative;
    z-index: 1;
    width: min(420px, 94vw);
    animation: cardIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    opacity: 0;
    transform: translateY(32px);
  }

  @keyframes cardIn {
    to { opacity: 1; transform: translateY(0); }
  }

  .card {
    background: var(--dark);
    border-radius: 24px;
    border: 1px solid var(--border);
    overflow: hidden;
    box-shadow:
      0 0 0 1px rgba(232,119,34,0.08),
      0 32px 80px rgba(0,0,0,0.7),
      0 0 60px rgba(232,119,34,0.08);
  }

  /* Header */
  .card-header {
    background: #ffffff;
    padding: 32px 36px 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .card-header::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--orange-deep), var(--orange-glow), var(--orange-deep));
  }

  .logo-img {
    height: 80px;
    width: auto;
    object-fit: contain;
  }

  /* Body */
  .card-body {
    padding: 36px 36px 28px;
  }

  .name-block {
    margin-bottom: 6px;
    animation: slideIn 0.6s 0.2s cubic-bezier(0.16,1,0.3,1) both;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-16px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 42px;
    letter-spacing: 2px;
    color: #fff;
    line-height: 1;
  }

  .name span {
    color: var(--orange);
  }

  .role {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--orange);
    margin-top: 8px;
    margin-bottom: 28px;
    animation: slideIn 0.6s 0.3s cubic-bezier(0.16,1,0.3,1) both;
  }

  /* Divider */
  .divider {
    height: 1px;
    background: linear-gradient(90deg, var(--orange) 0%, transparent 100%);
    margin-bottom: 28px;
    opacity: 0.4;
  }

  /* Contact items */
  .contact-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
    animation: slideIn 0.6s 0.4s cubic-bezier(0.16,1,0.3,1) both;
  }

  .contact-item {
    display: flex;
    align-items: center;
    gap: 14px;
    text-decoration: none;
    group: true;
    transition: transform 0.2s;
  }

  .contact-item:hover {
    transform: translateX(4px);
  }

  .icon-wrap {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: rgba(232,119,34,0.12);
    border: 1px solid rgba(232,119,34,0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.2s, border-color 0.2s;
  }

  .contact-item:hover .icon-wrap {
    background: rgba(232,119,34,0.22);
    border-color: var(--orange);
  }

  .icon-wrap svg {
    width: 17px;
    height: 17px;
    fill: var(--orange);
  }

  .contact-text {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }

  .contact-label {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  .contact-value {
    font-size: 15px;
    font-weight: 400;
    color: #fff;
    letter-spacing: 0.2px;
  }

  /* CTA buttons */
  .cta-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 32px;
    animation: slideIn 0.6s 0.5s cubic-bezier(0.16,1,0.3,1) both;
  }

  .btn {
    padding: 14px 0;
    border-radius: 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-align: center;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
  }

  .btn-primary {
    background: var(--orange);
    color: #fff;
    border: none;
  }

  .btn-primary:hover {
    background: var(--orange-glow);
    box-shadow: 0 0 20px rgba(232,119,34,0.4);
    transform: translateY(-1px);
  }

  .btn-secondary {
    background: transparent;
    color: var(--orange);
    border: 1px solid var(--border);
  }

  .btn-secondary:hover {
    background: rgba(232,119,34,0.08);
    border-color: var(--orange);
    transform: translateY(-1px);
  }

  .btn svg {
    width: 15px;
    height: 15px;
    fill: currentColor;
  }

  /* Footer tag */
  .card-footer {
    padding: 18px 36px;
    border-top: 1px solid rgba(255,255,255,0.05);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .footer-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--orange);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.7); }
  }

  .footer-text {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .footer-text strong {
    color: var(--orange);
  }
</style>
</head>
